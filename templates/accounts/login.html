{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-24">
    <div class="bg-white rounded-[4rem] p-12 border border-gray-100 shadow-2xl space-y-10">
        <div class="space-y-4 text-center">
            <h1 class="text-4xl font-black text-gray-900 tracking-tighter uppercase">Identify</h1>
            <p class="text-gray-400 font-medium uppercase text-xs tracking-widest">Establish secure session link</p>
        </div>

        <form method="POST" class="space-y-8">
            {% csrf_token %}
            <div class="space-y-6">
                <div class="space-y-3">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] pl-1">Identifier</label>
                    <input type="text" name="username" required class="w-full bg-gray-50 border border-gray-100 rounded-[1.5rem] px-6 py-4 text-sm font-bold focus:outline-none focus:ring-4 focus:ring-orange-100 transition-all">
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] pl-1">Cipher</label>
                    <input type="password" name="password" required class="w-full bg-gray-50 border border-gray-100 rounded-[1.5rem] px-6 py-4 text-sm font-bold focus:outline-none focus:ring-4 focus:ring-orange-100 transition-all">
                </div>
            </div>

            <button type="submit" class="w-full premium-gradient text-white py-5 rounded-[2rem] text-lg font-black shadow-2xl shadow-orange-100 hover:scale-[1.02] active:scale-95 transition-all uppercase tracking-widest">
                Authorize
            </button>
        </form>

        <div class="text-center pt-4">
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">New Operator? <a href="{% url 'register' %}" class="text-[#ff6b35] hover:underline">Register Identity</a></p>
        </div>
    </div>
</div>
{% endblock %}
