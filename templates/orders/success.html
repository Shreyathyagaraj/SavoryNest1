{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-32 text-center space-y-12">
    <div class="w-40 h-40 bg-green-50 rounded-[4rem] flex items-center justify-center mx-auto shadow-2xl relative">
        <i class="fas fa-check text-green-500 text-6xl"></i>
        <div class="absolute -top-4 -right-4 w-12 h-12 premium-gradient rounded-full flex items-center justify-center text-white animate-bounce">
            <i class="fas fa-star"></i>
        </div>
    </div>
    
    <div class="space-y-4">
        <h1 class="text-6xl font-black text-gray-900 tracking-tighter uppercase italic">Success</h1>
        <p class="text-gray-400 font-medium uppercase text-xs tracking-[0.4em]">Mission Authorization Confirmed</p>
    </div>

    <div class="bg-white rounded-[3rem] p-12 border border-gray-100 shadow-2xl space-y-8">
        <p class="text-xl text-gray-500 font-medium leading-relaxed italic">
            "Your payload has been synchronized with our tactical delivery squad. Track your arrival via the Identity Hub."
        </p>
        
        <div class="flex flex-col gap-4">
            <a href="{% url 'profile' %}" class="premium-gradient text-white py-5 rounded-[2rem] text-lg font-black shadow-2xl hover:scale-[1.02] active:scale-95 transition-all uppercase tracking-widest">
                Identity Hub
            </a>
            <a href="{% url 'home' %}" class="text-[10px] font-black text-gray-400 uppercase tracking-widest hover:text-[#ff6b35]">Return to Base</a>
        </div>
    </div>
</div>
{% endblock %}
